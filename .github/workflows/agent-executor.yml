name: Agent Executor

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Hermes Kanban task ID'
        required: true
        type: string
      task_brief:
        description: 'What the agent should do'
        required: true
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Agent Task
        run: |
          echo "=== AGENT TASK ==="
          echo "ID: ${{ inputs.task_id }}"
          echo "BRIEF: ${{ inputs.task_brief }}"
          echo "RESULT: completed at $(date -u)"
